name: Portfolio CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone homepage
        run: python build.py

      - name: Validate generated homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path("dist/index.html").read_text(encoding="utf-8")
          assert html.lstrip().lower().startswith("<!doctype html>"), "Missing HTML doctype"
          assert "{% include" not in html, "Unresolved include tag"

          for section in ("about", "works", "contact"):
              assert f'id="{section}"' in html, f"Missing section: {section}"

          for asset in ("style.css", "assets/images/banner.png"):
              assert Path(asset).is_file(), f"Missing referenced asset: {asset}"

          print("Standalone homepage checks passed")
          PY

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1

      - name: Validate Jekyll output
        run: |
          test -s _site/index.html
          test -s _site/blog/index.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
