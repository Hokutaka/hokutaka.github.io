---
layout: default
---
<article class="post" aria-labelledby="note-title">
  <div class="post__inner">
    <header class="post__header">
      <p class="section-label">AI Notes / Research draft</p>
      <h1 class="post__title" id="note-title">{{ page.title | escape }}</h1>
      <p class="post__meta">
        AI補助による調査メモ ／ 確認日：{{ page.reviewed_at | default: "未確認" }}
      </p>
    </header>

    <div class="post__body">
      <blockquote>
        このページはAIが資料を整理した調査草稿です。個人の実体験・製品評価・動作検証を示すものではありません。
        仕様、価格、権利条件、法令は変わり得るため、実務に用いる前に公式情報と現行規約を確認してください。
      </blockquote>
      {{ content }}
    </div>

    <p class="post__back">
      <a href="/ai-notes/">← AI Notes一覧へ</a>
    </p>
  </div>
</article>
