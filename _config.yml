title: Hokutaka | Portfolio
description: "Hokutaka/lililifire - プログラムとらくがきが好きです。"
url: "https://hokutaka.dev"
lang: ja

permalink: /blog/:title/

collections:
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "ai_notes"
    values:
      layout: "note"

exclude:
  - build.py
  - README.md
