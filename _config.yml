title: Hokutaka | Portfolio
description: "Hokutaka/lililifire - プログラムとらくがきが好きです。"
url: "https://hokutaka.dev"
lang: ja

permalink: /blog/:title/

collections:
  ai_notes:
    output: true
    permalink: /ai-notes/:name/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "ai_notes"
    values:
      layout: "ai-note"

exclude:
  - build.py
  - README.md
